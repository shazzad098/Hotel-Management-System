<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Royal Stay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="navbar" id="navbar">
    <a class="logo" href="index.html">Royal<span>Stay</span></a>
    <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
    <nav id="navMenu">
      <a href="index.html">Home</a>
      <a href="rooms.html">Rooms</a>
      <a href="booking.html">Book Now</a>
    </nav>
  </header>

  <section class="login-section">
    <div class="login-card">
      <div class="login-media">
        <div class="hero-badge" style="align-self:flex-start">ADMIN PANEL</div>
        <h3>Welcome Back, Manager</h3>
        <p>Manage bookings, revenue and guests — all from one dashboard.</p>
      </div>
      <div class="login-box">
        <h2>Admin Login</h2>
        <p>Login to manage hotel bookings</p>
        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
          </div>
          <button type="submit" class="submit-btn">Login to Dashboard →</button>
          <p id="loginError" class="login-error"></p>
        </form>
        <div class="demo-login">Demo Username: <b>admin</b> &nbsp;•&nbsp; Demo Password: <b>12345</b></div>
        <p style="text-align:center;margin-top:14px;font-size:13px"><a href="index.html"
            style="color:#a77b39;font-weight:700">← Back to Home</a></p>
      </div>
    </div>
  </section>

  <footer>
    <div class="footer-bottom">
      <p>© 2026 <strong>Royal Stay Hotel</strong>. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>

</html>
